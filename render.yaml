# Render Blueprint — one FREE web service runs the website AND the Telegram bot.
# Telegram delivers messages to /api/telegram/webhook; an external scheduler (cron-job.org, free)
# calls /api/cron every few minutes for EOD/EOW posts, auto-offline, and to keep the free instance awake.
#
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once.

services:
  - type: web
    name: tasktrack-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # --- secrets you paste in ---
      - key: MONGODB_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_URL
        sync: false # e.g. https://tasktrack-web.onrender.com (no trailing slash)
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # --- generated by Render ---
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true # copy this into the cron-job.org URL
      # --- settings ---
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_MIN_CONFIDENCE
        value: "0.6"
      - key: AUTO_OFFLINE_MINUTES
        value: "240"
      - key: REPORT_EOD_TIME
        value: "19:00"
      - key: REPORT_WORK_DAYS
        value: "1,2,3,4,5"
      - key: REPORT_EOW_DAY
        value: "5"
